baseURL = "https://go-mswin.github.io/"
title = "go-mswin"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

[params]
  subtitle = "the Windows API from Go, the peer of go-macos/objc"
  description = "Calling the Windows API from Go on 64-bit Windows (amd64 + arm64), built on golang.org/x/sys/windows with no cgo: win32 provides the shared surface, winrt adds only what the reference WinRT projection does not, without reimplementing it."
  tagline = "The Windows API from Go — the deliberate peer of <a href=\"https://github.com/go-macos/objc\">go-macos/objc</a>, so a cross-platform program talks to two libraries built the same way."
  pills = ["64-bit Windows: amd64 + arm64", "golang.org/x/sys/windows", "no cgo", "BSD-3-Clause"]
  primary_role = "foundation"
  leads = [
    "“win32” is the <strong>name of the Windows API</strong>, not a bitness — there is no separate “Win64 API”. These target 64-bit Windows, amd64 and arm64.",
    "<strong>Reference libraries, not re-implementations.</strong> <code>winrt</code> does not reimplement WinRT: <code>RoInitialize</code> and <code>RoGetActivationFactory</code> come from the reference projection, and this module adds only what is missing around it. Same rule as everywhere else in the fleet."
  ]
  principles = "The reason this org exists at all is symmetry: go-macos/objc gave the fleet's CGO-free macOS code one shared home instead of per-repo copies, and the Windows side deserved the same rather than a pile of hand-rolled syscalls."

[[params.repos]]
  name = "win32"
  role = "foundation"
  reach = "golang.org/x/sys/windows, no cgo"
  gomod = true
  result = "The shared Windows API surface the fleet's Windows code would otherwise re-declare per repository."
[[params.repos]]
  name = "winrt"
  role = "extension"
  reach = "saltosystems/winrt-go + the missing pieces"
  gomod = true
  result = "Activation and initialisation through the <strong>reference WinRT projection</strong>, plus only what that projection leaves out."
  note = "Deliberately thin: the value is in not having a second WinRT implementation to keep correct."
[[params.repos]]
  name = "screencapture"
  role = "capture"
  reach = "DXGI Desktop Duplication + GDI BitBlt, through go-mswin/win32"
  gomod = true
  result = "Display and window capture as borrowed BGRA frames, allocation-free per frame. Two backends behind one API: DXGI Desktop Duplication where it is available, GDI <code>BitBlt</code> everywhere else and for occluded windows through <code>PrintWindow(PW_RENDERFULLCONTENT)</code>."
  note = "Its proof record is checkable rather than asserted: a GDI capture and a duplication capture each matched QEMU's own independent <code>screendump</code> of the framebuffer in <strong>0 of 480000 pixels</strong>, and CI re-runs the comparison so the record cannot drift from the files. What it has NOT proven — the GPU duplication path, a real 4K read-back, multi-monitor — is listed just as plainly."
[[params.repos]]
  name = "webauthn"
  role = "extension"
  reach = "webauthn.dll — the API browsers use, no cgo and no SDK"
  gomod = true
  result = "Asks Windows to authenticate somebody with a security key: <code>Assert</code> takes the relying-party id, a fresh challenge and the credentials to allow, and answers with what actually responded (<code>a.Transport</code> — \"usb\"). It is deliberately <strong>not</strong> a CTAP transport: since Windows 1903 raw FIDO HID needs elevation, so going through webauthn.dll is what lets an ordinary user log in at all."
[[params.repos]]
  name = "factors"
  role = "extension"
  reach = "go-authn/mfa — an mfa.Factor a policy can ask for"
  gomod = true
  result = "Windows's authentication factors as <code>mfa.Factor</code> values, so a policy asks for two of them without knowing which Windows API answers. The two come from two different packages, which is the shape of Windows: winrt asks Windows Hello through <code>UserConsentVerifier</code>, webauthn asks a security key through <code>webauthn.dll</code>. Neither binding knows what a policy is, and a program that only wants a Hello prompt does not end up importing the other."
